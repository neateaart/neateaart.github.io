<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subastas | Artista</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auction-style.css" />
</head>
<body>
    <!-- ===== NAVEGACIÓN ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">🎨 My Art</span>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="auction.html" class="active">Subastas</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== SECCIÓN DE SUBASTA ===== -->
    <section class="auction-container">
        
        <!-- COLUMNA IZQUIERDA: Arte en subasta -->
        <div class="auction-left">
            <div class="art-card">
                <img 
                    src="" 
                    alt="Obra en subasta" 
                    class="art-image"
                    id="artImage"
                />
                <div class="art-info">
                    <h2 class="art-title" id="artTitle">Cargando...</h2>
                    <p class="art-description" id="artDescription">Cargando...</p>
                    <div class="art-meta">
                        <span class="art-price">💰 Oferta más alta: <strong id="currentPrice">$0 USD</strong></span>
                        <span class="art-bids">👥 Ofertas: <strong id="totalBids">0</strong></span>
                    </div>
                    <div class="art-status" id="auctionStatus">
                        <span style="color: #00b894;">✅ Subasta activa</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: Ofertas y formulario -->
        <div class="auction-right">
            
            <!-- LISTA DE OFERTAS -->
            <div class="bids-section">
                <h3 class="bids-title">📋 Ofertas realizadas</h3>
                <div class="bids-list" id="bidsList">
                    <div class="bid-empty">
                        <p>Cargando ofertas...</p>
                    </div>
                </div>
            </div>

            <!-- FORMULARIO PARA OFERTAR -->
            <div class="bid-form-section">
                <h3 class="form-title">✏️ Haz tu oferta</h3>
                <form id="bidForm" class="bid-form">
                    
                    <div class="form-group">
                        <label for="bidName">Tu nombre</label>
                        <input 
                            type="text" 
                            id="bidName" 
                            placeholder="Ej: Ana García" 
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="bidEmail">Correo de contacto</label>
                        <input 
                            type="email" 
                            id="bidEmail" 
                            placeholder="ejemplo@correo.com" 
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="bidAmount">Oferta en USD ($)</label>
                        <input 
                            type="number" 
                            id="bidAmount" 
                            placeholder="50" 
                            min="1" 
                            step="1"
                            required
                        />
                    </div>

                    <button type="submit" class="btn-submit-bid" id="submitBidBtn">
                        🚀 Enviar oferta
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- ===== PIE DE PÁGINA ===== -->
    <footer class="footer">
        <p>&copy; 2026 - Artista Lorem. Todos los derechos reservados.</p>
    </footer>

    <!-- ===== SUPABASE SDK ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    
    <!-- ===== TU SCRIPT ===== -->
    <script src="auction-script.js"></script>
</body>
</html>
